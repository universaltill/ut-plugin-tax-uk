name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: go vet
        # Cross-compiled to match scripts/build.sh's actual GOOS/GOARCH: this
        # plugin's entry point is behind a `//go:build wasip1` tag, so a host
        # `go vet ./...` silently skips it entirely (same as ut-plugin-tax-de).
        run: GOOS=wasip1 GOARCH=wasm go vet ./...
      - name: gofmt check
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "gofmt found unformatted files:" >&2
            echo "$fmt_out" >&2
            exit 1
          fi
      - name: Guard plugin i18n (locale key drift)
        run: scripts/guard-plugin-i18n.sh
      - name: Test (src/chargepolicy + src/hmrcvat on the host; src/wasmrun builds and runs the real wasm module)
        run: go test ./...
      - name: Build WASI module
        run: scripts/build.sh
      - name: Validate manifest + plugin manifest
        run: scripts/validate.sh
      - name: Package (dry run)
        run: scripts/package.sh
